<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080808;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #2e2e2e;
    --border-bright: #444;
    --accent: #f2cc1d;
    --accent-hover: #f5d84a;
    --accent-dim: rgba(242,204,29,0.08);
    --text: #ffffff;
    --text-mid: #aaa;
    --muted: #666;
    --track-bg: #222;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background-image: none;
    background-size: cover;
    background-position: center;
    transition: background-image 0.8s ease;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: inherit;
    background-size: cover;
    background-position: center;
    filter: blur(18px) saturate(0.4) brightness(0.18);
    transform: scale(1.1);
    z-index: 0;
    transition: opacity 1s ease;
  }

  .player {
    position: relative;
    z-index: 1;
  }

  .player {
    width: 100%;
    max-width: 600px;
  }
  /* (z-index set above in body block) */

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .header-right { display: flex; align-items: center; gap: 0.5rem; position: relative; }

  .header h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 1.3rem;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  .header span {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }



  /* ── Add Music button ── */
  #add-music-btn {
    display: flex; align-items: center; gap: 0.45rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    padding: 0.4rem 0.75rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #add-music-btn:hover { color: var(--text); border-color: #666; }
  #add-music-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

  /* ── Full-window drag overlay ── */
  #drag-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.75);
    border: 3px dashed var(--accent);
    border-radius: 12px;
    margin: 12px;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 0.75rem;
    pointer-events: none;
  }
  #drag-overlay.active { display: flex; }
  #drag-overlay span {
    font-family: 'Unbounded', sans-serif;
    font-size: 1.1rem; font-weight: 700;
    color: var(--accent); letter-spacing: -0.02em;
  }
  #drag-overlay small {
    font-size: 0.7rem; color: var(--text-mid);
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  /* ── Cassette animation ── */
  .now-playing { position: relative; }

  /* ── Vinyl record sleeve animation ── */
  .cover-wrapper {
    position: relative;
    flex-shrink: 0;
    width: 80px;
    height: 80px;
  }

  /* The vinyl lives here, absolutely positioned behind the cover */
  #vinyl-el {
    position: absolute;
    top: 50%;
    /* hidden = centre of record at centre of cover (fully behind) */
    left: 50%;
    transform: translate(-50%, -50%);
    width: 76px; height: 76px;
    z-index: 0;
    will-change: left;
    pointer-events: none;
  }

  /* out = centre of record at right edge of cover */
  #vinyl-el.out {
    left: 80px;  /* = cover width; centre = 80 - 38 = 42px visible on right */
    transition: left 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* retract = slide back in (immediate, will swap cover then slide out again) */
  #vinyl-el.retract {
    left: 50%;
    transition: left 0.3s ease-in;
  }

  /* spinning */
  #vinyl-el .vinyl-disc {
    transform-origin: 38px 38px;
  }
  #vinyl-el.spinning .vinyl-disc {
    animation: vinyl-spin 2.4s linear infinite;
  }

  @keyframes vinyl-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── Now playing panel — always visible ── */
  .now-playing {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    overflow: visible;
  }

  /* ── Cover + track info ── */
  .cover-row {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
    overflow: visible;
  }



  .cover-art {
    width: 80px; height: 80px;
    border-radius: 4px; object-fit: cover;
    display: none;
    border: 1px solid var(--border-bright);
    position: relative; z-index: 1;
  }
  .cover-art.visible { display: block; }

  .cover-placeholder {
    width: 80px; height: 80px;
    border-radius: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative; z-index: 1;
  }
  .cover-placeholder.hidden { display: none; }

  .track-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; align-items: flex-end; text-align: right; }

  .track-name {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    /* wrap instead of ellipsis — break at word boundary, max 2 lines */
    overflow-wrap: break-word;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--accent);
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .track-name.empty { color: var(--muted); font-weight: 400; }

  .track-album {
    font-size: 0.7rem;
    color: var(--text-mid);
    overflow-wrap: break-word;
    word-break: break-word;
    line-height: 1.4;
  }

  .track-artist {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.3;
  }

  /* ── Seek bar ── */
  .seek-row {
    display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;
  }

  .time {
    font-size: 0.7rem; color: var(--text-mid);
    min-width: 2.8rem; text-align: center;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px;
    background: var(--track-bg); border-radius: 2px; outline: none; cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  #seek-bar { background: linear-gradient(to right, var(--accent) 0%, var(--track-bg) 0%); }

  /* ── Controls row ── */
  .controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }

  .left-controls  { display: flex; align-items: center; justify-content: flex-start; gap: 0.4rem; }
  .main-controls  { display: flex; align-items: center; gap: 0.5rem; justify-content: center; }
  .right-controls { display: flex; align-items: center; justify-content: flex-end; }

  #shuffle-btn.active { color: var(--accent); }

  button {
    background: none; border: none; cursor: pointer;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    transition: color 0.15s;
    padding: 0.4rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }

  button:hover { color: var(--text); }
  button svg { width: 20px; height: 20px; fill: currentColor; }

  #play-btn {
    background: var(--accent);
    color: #000;
    width: 46px; height: 46px;
    border-radius: 50%;
    margin: 0 0.25rem;
  }

  #play-btn:hover { background: var(--accent-hover); color: #000; }
  #play-btn svg { width: 18px; height: 18px; }

  #repeat-btn.active { color: var(--accent); }

  /* ── Volume ── */
  .volume-row { display: flex; align-items: center; gap: 0.5rem; }

  #vol-bar {
    width: 80px; height: 4px;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.5rem 0 1.25rem;
  }

  /* ── Queue — always visible ── */
  .queue { display: block; }

  .queue-header {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-mid);
    font-weight: 500;
    margin-bottom: 0.75rem;
    display: flex; justify-content: space-between; align-items: center;
  }

  .queue-header button {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.25rem 0.6rem;
    border: 1px solid var(--border-bright);
    border-radius: 3px;
    transition: color 0.15s, border-color 0.15s;
  }

  .queue-header button:hover {
    color: var(--text); border-color: #666;
  }

  .queue-list {
    list-style: none;
    background: var(--bg);
    max-height: 351px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-bright) transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    overflow-y: auto;
  }

  .queue-empty {
    background: var(--bg);
    padding: 2rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .queue-list li {
    padding: 0.65rem 0.9rem;
    font-size: 0.75rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.75rem;
    color: var(--text-mid);
    transition: background 0.1s, color 0.1s;
    border-bottom: 1px solid var(--border);
  }

  .queue-list li:last-child { border-bottom: none; }
  .queue-list li:hover { background: var(--surface2); color: var(--text); }

  .queue-list li.active {
    color: var(--accent);
    background: var(--accent-dim);
  }

  .queue-list li .idx {
    min-width: 1.4rem;
    color: var(--border-bright);
    font-size: 0.65rem;
    flex-shrink: 0;
  }

  .queue-list li.active .idx { color: var(--accent); }

  .queue-thumb {
    width: 36px; height: 36px;
    border-radius: 3px; object-fit: cover;
    flex-shrink: 0; border: 1px solid var(--border-bright);
  }

  .queue-thumb-placeholder {
    width: 36px; height: 36px;
    border-radius: 3px;
    background: var(--surface2);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; color: var(--muted);
  }

  .queue-track-info { flex: 1; min-width: 0; }

  .queue-track-name {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 0.75rem;
  }

  .queue-track-artist {
    font-size: 0.65rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 0.15rem;
  }

  li.active .queue-track-artist { color: rgba(242,204,29,0.5); }

  /* ── Options button — matches add-music-btn style ── */
  #colour-btn {
    display: flex; align-items: center; gap: 0.45rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    padding: 0.4rem 0.75rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #colour-btn:hover { color: var(--text); border-color: #666; }
  #colour-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

  /* ── Options panel ── */
  #options-panel {
    display: none;
    position: absolute;
    top: calc(100% + 0.5rem);
    right: 0;
    width: 260px;
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 6px;
    padding: 1rem;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #options-panel.open { display: block; }

  .options-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .option-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-mid);
    margin-bottom: 0.4rem;
  }

  /* Colour spectrum square */
  #colour-spectrum {
    width: 100%;
    height: 120px;
    border-radius: 4px;
    cursor: crosshair;
    display: block;
    border: 1px solid var(--border);
  }

  /* Hue slider */
  #hue-slider {
    width: 100%;
    height: 10px;
    border-radius: 5px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    margin-bottom: 0.6rem;
    background: linear-gradient(to right,
      hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%),
      hsl(90,100%,50%), hsl(120,100%,50%), hsl(150,100%,50%),
      hsl(180,100%,50%), hsl(210,100%,50%), hsl(240,100%,50%),
      hsl(270,100%,50%), hsl(300,100%,50%), hsl(330,100%,50%), hsl(360,100%,50%));
    border: 1px solid var(--border);
  }
  #hue-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: white;
    border: 2px solid #333;
    cursor: pointer;
  }

  /* Hex input row */
  .hex-row {
    display: flex; align-items: center; gap: 0.4rem;
    width: 100%;
  }
  .colour-preview {
    width: 24px; height: 24px;
    border-radius: 3px;
    border: 1px solid var(--border-bright);
    flex-shrink: 0;
    background: var(--accent);
  }
  #hex-input {
    width: 90px;
    flex-shrink: 0;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 0.3rem 0.5rem;
    outline: none;
    text-transform: uppercase;
  }
  #hex-input:focus { border-color: #666; }
  #apply-colour-btn {
    flex: 1;
    font-size: 0.65rem;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0.3rem 0;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  #apply-colour-btn:hover { background: var(--accent-hover); }

  /* Spectrum cursor dot */
  #spectrum-cursor {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
    pointer-events: none;
    transform: translate(-50%, -50%);
    top: 50%; left: 50%;
  }
</style>
</head>
<body>
<div class="player">

  <div class="header">
    <h1>MUSIC PLAYER</h1>
    <div class="header-right">
      <button id="colour-btn" title="Options">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Options
      </button>
      <button id="add-music-btn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Add Music
      </button>
      <!-- Options panel -->
      <div id="options-panel">
        <div class="options-title">Accent Colour</div>
        <div class="option-label">Colour</div>
        <div style="position:relative;margin-bottom:0.6rem;">
          <canvas id="colour-spectrum" width="228" height="120" style="display:block;width:100%;height:120px;border-radius:4px;cursor:crosshair;border:1px solid var(--border);"></canvas>
          <div id="spectrum-cursor"></div>
        </div>
        <input type="range" id="hue-slider" min="0" max="360" value="45">
        <div class="hex-row">
          <div class="colour-preview" id="colour-preview"></div>
          <input type="text" id="hex-input" maxlength="7" placeholder="#F2CC1D">
          <button id="apply-colour-btn">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden file input for the Add Music button -->
  <input type="file" id="file-input" accept="audio/*" multiple style="display:none">

  <!-- Full-window drag overlay -->
  <div id="drag-overlay">
    <span>DROP TO ADD</span>
    <small>mp3 · wav · flac · ogg · m4a</small>
  </div>

  <!-- Always visible now-playing panel -->
  <div class="now-playing" id="now-playing">

    <div class="cover-row">
      <div class="cover-wrapper">
        <!-- Vinyl behind the cover (z-index 0); JS moves it in/out -->
        <svg id="vinyl-el" viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg">
          <g class="vinyl-disc">
            <circle cx="38" cy="38" r="37" fill="#111"/>
            <circle cx="38" cy="38" r="35" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="32" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="29" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="26" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="23" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="20" fill="none" stroke="#3a3a3a" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="16" id="vinyl-label" fill="#f2cc1d"/>
            <circle cx="38" cy="38" r="16" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>
            <line x1="26" y1="35" x2="50" y2="35" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
            <line x1="27" y1="38" x2="49" y2="38" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
            <line x1="28" y1="41" x2="48" y2="41" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
            <circle cx="38" cy="38" r="3" fill="#111"/>
          </g>
        </svg>
        <!-- Cover on top (z-index 1) -->
        <img class="cover-art" id="cover-art" src="" alt="Album art">
        <div class="cover-placeholder" id="cover-placeholder">
          <svg viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
            <circle cx="38" cy="38" r="37" fill="#2a2a2a"/>
            <circle cx="38" cy="38" r="35" fill="none" stroke="#333" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="32" fill="none" stroke="#333" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="29" fill="none" stroke="#333" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="26" fill="none" stroke="#333" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="23" fill="none" stroke="#333" stroke-width="1.2"/>
            <circle cx="38" cy="38" r="20" fill="none" stroke="#333" stroke-width="1.2"/>

<script>
// ─── Minimal self-contained tag reader ────────────────────────────────────────
// Reads ID3v2 (MP3), ftyp/moov (M4A/AAC), and ID3 in FLAC/OGG cover art + title/artist.

async function readAudioTags(file) {
  const result = { title: null, artist: null, album: null, year: null, coverDataUrl: null };
  try {
    // Read first 512 KB — enough for most tags
    const sliceSize = Math.min(file.size, 512 * 1024);
    const buf = await file.slice(0, sliceSize).arrayBuffer();
    const bytes = new Uint8Array(buf);

    const ext = file.name.split('.').pop().toLowerCase();

    if (ext === 'mp3' || ext === 'aac') {
      parseID3v2(bytes, result);
    } else if (ext === 'm4a' || ext === 'mp4' || ext === 'aac') {
      parseMP4(bytes, result);
    } else if (ext === 'flac') {
      parseFLAC(bytes, result);
    } else if (ext === 'ogg' || ext === 'opus') {
      // OGG Vorbis comment metadata (text only, covers rare)
      parseOGG(bytes, result);
    } else {
      // Try ID3v2 as fallback
      parseID3v2(bytes, result);
    }
  } catch(e) { /* silently fail */ }
  return result;
}

// ── ID3v2 ──────────────────────────────────────────────────────────────────────
function parseID3v2(bytes, result) {
  if (bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) return; // "ID3"
  const ver = bytes[3];
  const flagUnsync = (bytes[5] & 0x80) !== 0;
  const tagSize = syncsafe(bytes, 6);
  let pos = 10;
  const end = Math.min(10 + tagSize, bytes.length);

  while (pos < end - 10) {
    const frameId = String.fromCharCode(bytes[pos], bytes[pos+1], bytes[pos+2], bytes[pos+3]);
    if (frameId === '\0\0\0\0') break;
    const frameSize = ver >= 4
      ? syncsafe(bytes, pos + 4)
      : (bytes[pos+4] << 24) | (bytes[pos+5] << 16) | (bytes[pos+6] << 8) | bytes[pos+7];
    const frameFlags = (bytes[pos+8] << 8) | bytes[pos+9];
    pos += 10;
    if (frameSize <= 0 || pos + frameSize > bytes.length) break;

    const frameBytes = bytes.slice(pos, pos + frameSize);

    if ((frameId === 'TIT2' || frameId === 'TT2\0') && !result.title) {
      result.title = decodeTextFrame(frameBytes);
    } else if ((frameId === 'TPE1' || frameId === 'TP1\0') && !result.artist) {
      result.artist = decodeTextFrame(frameBytes);
    } else if ((frameId === 'TALB' || frameId === 'TAL\0') && !result.album) {
      result.album = decodeTextFrame(frameBytes);
    } else if ((frameId === 'TDRC' || frameId === 'TYER' || frameId === 'TYE\0') && !result.year) {
      const raw = decodeTextFrame(frameBytes);
      result.year = raw ? raw.slice(0, 4) : null;
    } else if ((frameId === 'APIC' || frameId === 'PIC\0') && !result.coverDataUrl) {
      result.coverDataUrl = parseAPIC(frameBytes, frameId === 'PIC\0');
    }
    pos += frameSize;
  }
}

function syncsafe(bytes, pos) {
  return ((bytes[pos] & 0x7f) << 21) | ((bytes[pos+1] & 0x7f) << 14) |
         ((bytes[pos+2] & 0x7f) << 7)  |  (bytes[pos+3] & 0x7f);
}

function decodeTextFrame(bytes) {
  const enc = bytes[0];
  const data = bytes.slice(1);
  try {
    if (enc === 0) return new TextDecoder('latin1').decode(data).replace(/\0/g, '').trim();
    if (enc === 1 || enc === 2) return new TextDecoder('utf-16').decode(data).replace(/\0/g, '').trim();
    return new TextDecoder('utf-8').decode(data).replace(/\0/g, '').trim();
  } catch(e) { return null; }
}

function parseAPIC(bytes, oldStyle) {
  // APIC: encoding(1) + mime(null-terminated) + picType(1) + desc(null-term) + data
  let pos = 1; // skip encoding byte
  if (oldStyle) {
    // PIC: encoding(1) + format(3) + picType(1) + desc(null-term) + data
    const fmt = String.fromCharCode(bytes[1], bytes[2], bytes[3]).toLowerCase();
    const mime = fmt === 'jpg' ? 'image/jpeg' : `image/${fmt}`;
    pos = 4;
    while (pos < bytes.length && bytes[pos] !== 0) pos++;
    pos++;
    return bytesToDataUrl(bytes.slice(pos), mime);
  }
  // Find MIME type (null-terminated after encoding byte)
  let mimeStart = 1;
  while (pos < bytes.length && bytes[pos] !== 0) pos++;
  const mime = new TextDecoder().decode(bytes.slice(mimeStart, pos)) || 'image/jpeg';
  pos++; // skip null
  pos++; // skip picture type byte
  // Skip description (null or double-null terminated)
  const enc = bytes[0];
  if (enc === 1 || enc === 2) {
    while (pos < bytes.length - 1 && !(bytes[pos] === 0 && bytes[pos+1] === 0)) pos += 2;
    pos += 2;
  } else {
    while (pos < bytes.length && bytes[pos] !== 0) pos++;
    pos++;
  }
  return bytesToDataUrl(bytes.slice(pos), mime);
}

// ── MP4 / M4A ─────────────────────────────────────────────────────────────────
function parseMP4(bytes, result) {
  function readBox(buf, start, end) {
    let pos = start;
    while (pos < end - 8) {
      let size = (buf[pos]<<24)|(buf[pos+1]<<16)|(buf[pos+2]<<8)|buf[pos+3];
      const type = String.fromCharCode(buf[pos+4],buf[pos+5],buf[pos+6],buf[pos+7]);
      if (size === 0) size = end - pos;
      if (size < 8) break;
      const boxEnd = Math.min(pos + size, end);
      const containers = ['moov','udta','meta','ilst','trak','mdia','minf','stbl'];
      // ilst children are like ©nam, ©ART, covr
      if (containers.includes(type)) {
        const skip = type === 'meta' ? pos + 12 : pos + 8;
        readBox(buf, skip, boxEnd);
      } else if (type === '\xa9nam' || type === '\xa9ART' || type === '\xa9alb' || type === '\xa9day' || type === 'covr') {
        // data atom inside
        let dpos = pos + 8;
        while (dpos < boxEnd - 8) {
          let dsize = (buf[dpos]<<24)|(buf[dpos+1]<<16)|(buf[dpos+2]<<8)|buf[dpos+3];
          const dtype = String.fromCharCode(buf[dpos+4],buf[dpos+5],buf[dpos+6],buf[dpos+7]);
          if (dsize < 8) break;
          if (dtype === 'data') {
            const flags = (buf[dpos+8]<<16)|(buf[dpos+9]<<8)|buf[dpos+10];
            const payload = buf.slice(dpos + 16, dpos + dsize);
            if (type === '\xa9nam' && !result.title)
              result.title = new TextDecoder().decode(payload).trim();
            else if (type === '\xa9ART' && !result.artist)
              result.artist = new TextDecoder().decode(payload).trim();
            else if (type === '\xa9alb' && !result.album)
              result.album = new TextDecoder().decode(payload).trim();
            else if (type === '\xa9day' && !result.year)
              result.year = new TextDecoder().decode(payload).trim().slice(0, 4);
            else if (type === 'covr' && !result.coverDataUrl) {
              const mime = flags === 14 ? 'image/png' : 'image/jpeg';
              result.coverDataUrl = bytesToDataUrl(payload, mime);
            }
          }
          dpos += dsize;
        }
      }
      pos += size;
    }
  }
  readBox(bytes, 0, bytes.length);
}

// ── FLAC ──────────────────────────────────────────────────────────────────────
function parseFLAC(bytes, result) {
  if (bytes[0]!==0x66||bytes[1]!==0x4C||bytes[2]!==0x61||bytes[3]!==0x43) return; // fLaC
  let pos = 4;
  while (pos < bytes.length) {
    const blockType = bytes[pos] & 0x7F;
    const isLast = (bytes[pos] & 0x80) !== 0;
    const size = (bytes[pos+1]<<16)|(bytes[pos+2]<<8)|bytes[pos+3];
    pos += 4;
    if (blockType === 4) { // VORBIS_COMMENT
      parseVorbisComment(bytes.slice(pos, pos + size), result);
    } else if (blockType === 6 && !result.coverDataUrl) { // PICTURE
      parseFLACPicture(bytes.slice(pos, pos + size), result);
    }
    pos += size;
    if (isLast) break;
  }
}

function parseFLACPicture(bytes, result) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const picType = view.getUint32(0);
  if (picType !== 3 && picType !== 0) return; // 3=front cover
  const mimeLen = view.getUint32(4);
  const mime = new TextDecoder().decode(bytes.slice(8, 8 + mimeLen));
  const descLen = view.getUint32(8 + mimeLen);
  const dataOffset = 8 + mimeLen + 4 + descLen + 16;
  const dataLen = view.getUint32(dataOffset - 4);
  result.coverDataUrl = bytesToDataUrl(bytes.slice(dataOffset, dataOffset + dataLen), mime || 'image/jpeg');
}

// ── OGG Vorbis comment ────────────────────────────────────────────────────────
function parseOGG(bytes, result) {
  // Scan for vorbis comment header signature
  const sig = [0x03,0x76,0x6f,0x72,0x62,0x69,0x73]; // \x03vorbis
  let pos = 0;
  outer: for (; pos < bytes.length - sig.length; pos++) {
    for (let i = 0; i < sig.length; i++) if (bytes[pos+i] !== sig[i]) continue outer;
    parseVorbisComment(bytes.slice(pos + sig.length), result);
    return;
  }
}

function parseVorbisComment(bytes, result) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let pos = 0;
  const vendorLen = view.getUint32(pos, true); pos += 4 + vendorLen;
  if (pos + 4 > bytes.length) return;
  const commentCount = view.getUint32(pos, true); pos += 4;
  for (let i = 0; i < commentCount && pos + 4 <= bytes.length; i++) {
    const len = view.getUint32(pos, true); pos += 4;
    if (pos + len > bytes.length) break;
    const comment = new TextDecoder().decode(bytes.slice(pos, pos + len));
    pos += len;
    const eq = comment.indexOf('=');
    if (eq === -1) continue;
    const key = comment.slice(0, eq).toUpperCase();
    const val = comment.slice(eq + 1);
    if (key === 'TITLE' && !result.title) result.title = val;
    if (key === 'ARTIST' && !result.artist) result.artist = val;
    if (key === 'ALBUM' && !result.album) result.album = val;
    if ((key === 'DATE' || key === 'YEAR') && !result.year) result.year = val.slice(0, 4);
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function bytesToDataUrl(bytes, mime) {
  try {
    let binary = '';
    const chunk = 8192;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode(...bytes.slice(i, i + chunk));
    }
    return `data:${mime};base64,${btoa(binary)}`;
  } catch(e) { return null; }
}

const VOL_OFF = "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z";

function fmt(s) {
  if (isNaN(s) || s === Infinity) return '0:00';

// ── Play state ────────────────────────────────────────────────────────────────
// stopped → ▶  playing → ▶  paused → ⏸
let playState = 'stopped';

// ── Dominant colour from cover art ───────────────────────────────────────────
function getDominantColour(imgSrc, cb) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 32, 32);
    const data = ctx.getImageData(0, 0, 32, 32).data;
    let r = 0, g = 0, b = 0, count = 0;
    for (let i = 0; i < data.length; i += 4) {
      const br = (data[i] + data[i+1] + data[i+2]) / 3;
      if (br < 20 || br > 235) continue;
      r += data[i]; g += data[i+1]; b += data[i+2]; count++;
    }
    if (!count) { cb('#f2cc1d'); return; }
    r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    const mid = (max + min) / 2;
    r = Math.min(255, Math.round(mid + (r - mid) * 1.3));
    g = Math.min(255, Math.round(mid + (g - mid) * 1.3));
    b = Math.min(255, Math.round(mid + (b - mid) * 1.3));
    cb(`rgb(${r},${g},${b})`);
  };
  img.onerror = () => cb('#f2cc1d');
  img.src = imgSrc;
}

// ── Vinyl state machine ───────────────────────────────────────────────────────
// States: hidden | out | spinning
// hidden  → record fully behind cover (left: 50%)
// out     → record half visible right (left: 80px), not spinning
// spinning→ out + spinning

function vinylHide() {
  vinylEl.classList.remove('out', 'retract', 'spinning');
  // force retract transition to hidden position
  vinylEl.style.left = '50%';
}

function vinylSlideOut() {
  vinylEl.classList.remove('retract');
  vinylEl.style.left = '';  // let CSS class control
  // small rAF to ensure transition fires
  requestAnimationFrame(() => vinylEl.classList.add('out'));
}

function vinylSpin() {
  vinylEl.classList.add('spinning');
}

function vinylPause() {
  vinylEl.classList.remove('spinning');
}

// Track change: retract current, then slide out new after cover swaps
let vinylChangeTimer = null;
function vinylTrackChange(newLabelColour, afterRetract) {
  if (vinylChangeTimer) clearTimeout(vinylChangeTimer);
  vinylEl.classList.remove('out', 'spinning');
  vinylEl.classList.add('retract');
  vinylEl.style.left = '50%';
  vinylChangeTimer = setTimeout(() => {
    vinylLabel.setAttribute('fill', newLabelColour);
    if (afterRetract) afterRetract();
    vinylEl.classList.remove('retract');
    vinylEl.style.left = '';
    requestAnimationFrame(() => {
      vinylEl.classList.add('out');
      vinylEl.classList.add('spinning');
    });
  }, 320);
}

function setPlayState(state) {
  playState = state;
  playIcon.setAttribute('d', state === 'paused' ? PAUSE_PATH : PLAY_PATH);
  if (state === 'playing') {
    vinylSpin();
  } else if (state === 'paused') {
    vinylPause();
    // keep 'out'
  } else {
    // stopped
    vinylPause();
  }
}

function doPlay() {
  const promise = audio.play();
  if (promise !== undefined) {
    promise.then(() => { setPlayState('playing'); }).catch(() => { setPlayState('stopped'); });
  } else {
    setPlayState('playing');
  }
}

function doPause() {
  audio.pause();
  setPlayState('paused');
}

playBtn.addEventListener('click', () => {
  if (playState === 'playing') doPause();
  else doPlay();
});

// ── Track loading ─────────────────────────────────────────────────────────────
const AUDIO_EXT = /\.(mp3|wav|flac|ogg|m4a|aac|opus)$/i;

function isAudioFile(f) {
  return f.type.startsWith('audio/') || AUDIO_EXT.test(f.name);
}

// Recursively read a FileEntry
function readEntry(entry) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => resolve(isAudioFile(f) ? [f] : []), () => resolve([]));
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const results = [];
      function readBatch() {
        reader.readEntries(async entries => {
          if (!entries.length) { resolve(results.flat()); return; }
          for (const e of entries) results.push(await readEntry(e));
          readBatch();
        }, () => resolve(results.flat()));
      }
      readBatch();
    } else {
      resolve([]);
    }
  });
}

// Called from file input (no entries API needed)
function loadFiles(files) {
  const audioFiles = Array.from(files).filter(isAudioFile);
  processAudioFiles(audioFiles);
}

// Called from drag-drop with pre-extracted entries
async function loadFromEntries(entries, plainFiles) {
  // Resolve all directory entries first
  const audioFiles = [...plainFiles.filter(isAudioFile)];
  for (const entry of entries) {
    const found = await readEntry(entry);
    audioFiles.push(...found);
  }
  processAudioFiles(audioFiles);
}

async function processAudioFiles(audioFiles) {
  if (!audioFiles.length) return;
  const wasEmpty = tracks.length === 0;
  for (const f of audioFiles) {
    const url = URL.createObjectURL(f);
    objectUrls.push(url);
    const meta = await readAudioTags(f);
    // Pre-decode cover art fully before storing — prevents partial render on all browsers
    if (meta.coverDataUrl) {
      await preDecodeImage(meta.coverDataUrl);
    }
    tracks.push({ name: meta.title || f.name.replace(/\.[^.]+$/, ''), artist: meta.artist || '', album: meta.album || '', year: meta.year || '', coverDataUrl: meta.coverDataUrl, url });
    // Render queue progressively as tracks come in
    renderQueue();
    if (wasEmpty && tracks.length === 1) playTrack(0);
  }
  renderQueue();
}

// Pre-warm the browser image cache so coverArt.onload fires instantly
function preDecodeImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      if (img.decode) {
        img.decode().then(resolve).catch(resolve);
      } else {
        resolve();
      }
    };
    img.onerror = resolve;
    img.src = src;
  });
}

function playTrack(index) {
  if (index < 0 || index >= tracks.length) return;
  const prevIndex = currentIndex;
  currentIndex = index;
  const t = tracks[index];
  audio.src = t.url;

  function applyMeta() {
    trackNameEl.textContent = t.name;
    trackNameEl.classList.remove('empty');
    trackArtistEl.textContent = t.artist;
    document.getElementById('track-album').textContent = t.album
      ? (t.year ? t.album + ' (' + t.year + ')' : t.album)
      : (t.year || '');
    if (t.coverDataUrl) {
      coverArt.classList.remove('visible'); // hide during load
      coverArt.onload = () => {
        coverArt.onload = null;
        coverArt.classList.add('visible');
        coverPlaceholder.classList.add('hidden');
        document.body.style.backgroundImage = `url(${t.coverDataUrl})`;
      };
      coverArt.onerror = () => {
        coverArt.onload = null;
        coverArt.classList.add('visible');
        coverPlaceholder.classList.add('hidden');
      };
      coverArt.src = t.coverDataUrl;
    } else {
      coverArt.onload = null;
      coverArt.classList.remove('visible');
      coverPlaceholder.classList.remove('hidden');
      document.body.style.backgroundImage = 'none';
    }
    renderQueue();
  }

  const isFirstTrack = prevIndex === -1;
  const getLabelAndPlay = (labelColour) => {
    if (isFirstTrack) {
      vinylLabel.setAttribute('fill', labelColour);
      applyMeta();
      vinylSlideOut();
      setTimeout(() => doPlay(), 200);
    } else {
      vinylTrackChange(labelColour, applyMeta);
      setTimeout(() => doPlay(), 350);
    }
  };

  if (t.coverDataUrl) {
    getDominantColour(t.coverDataUrl, getLabelAndPlay);
  } else {
    getLabelAndPlay('#f2cc1d');
  }
}

function renderQueue() {
  queueList.innerHTML = '';
  const emptyEl = document.getElementById('queue-empty');
  if (!tracks.length) {
    emptyEl.style.display = 'block';
    queueList.style.display = 'none';
    return;
  }
  emptyEl.style.display = 'none';
  queueList.style.display = 'block';
  tracks.forEach((t, i) => {
    const li = document.createElement('li');
    if (i === currentIndex) li.classList.add('active');
    const thumb = t.coverDataUrl
      ? `<img class="queue-thumb" src="${t.coverDataUrl}" alt="">`
      : `<div class="queue-thumb-placeholder">&#9834;</div>`;
    li.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span>${thumb}<div class="queue-track-info"><div class="queue-track-name">${t.name}</div>${t.artist ? `<div class="queue-track-artist">${t.artist}</div>` : ''}</div>`;
    li.addEventListener('click', () => playTrack(i));
    queueList.appendChild(li);
  });
}

// ── Drag & drop ───────────────────────────────────────────────────────────────
// ── Add Music button + file input ────────────────────────────────────────────
const addMusicBtn = document.getElementById('add-music-btn');
addMusicBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => loadFiles(fileInput.files));

// ── Window-level drag & drop with overlay ────────────────────────────────────
const dragOverlay = document.getElementById('drag-overlay');
let dragCounter = 0;

// Use window for drag events — more reliable across Chrome/Edge/Firefox
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragCounter++;
  dragOverlay.classList.add('active');
});
window.addEventListener('dragleave', e => {
  // Only decrement if leaving the window entirely (relatedTarget === null)
  if (e.relatedTarget === null) {
    dragCounter = 0;
    dragOverlay.classList.remove('active');
  }
});
window.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  return false;
});
window.addEventListener('drop', e => {
  e.preventDefault();
  e.stopPropagation();
  dragCounter = 0;
  dragOverlay.classList.remove('active');
  // Extract entries synchronously — dataTransfer is cleared after event
  const entries = [];
  const plainFiles = [];
  if (e.dataTransfer.items && e.dataTransfer.items.length) {
    for (let i = 0; i < e.dataTransfer.items.length; i++) {
      const item = e.dataTransfer.items[i];
      if (item.kind !== 'file') continue;
      const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
      if (entry) {
        entries.push(entry);
      } else {
        const f = item.getAsFile();
        if (f) plainFiles.push(f);
      }
    }
  } else if (e.dataTransfer.files && e.dataTransfer.files.length) {
    plainFiles.push(...Array.from(e.dataTransfer.files));
  }
  if (entries.length || plainFiles.length) loadFromEntries(entries, plainFiles);
  return false;
});

// ── Seek ──────────────────────────────────────────────────────────────────────
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  seekBar.value = pct;
  seekBar.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--track-bg) ${pct}%)`;
  currentTimeEl.textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => { durationEl.textContent = fmt(audio.duration); });
seekBar.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
});

// ── Prev / Next ───────────────────────────────────────────────────────────────
prevBtn.addEventListener('click', () => {
  if (audio.currentTime > 3) audio.currentTime = 0;
  else if (currentIndex > 0) playTrack(currentIndex - 1);
});
nextBtn.addEventListener('click', () => {
  if (currentIndex < tracks.length - 1) playTrack(currentIndex + 1);
});

// ── Repeat ────────────────────────────────────────────────────────────────────
// Cycle: off(0) → all(1) → one(2) → off(0)
let repeatMode = 0;

function updateRepeatBtn() {
  if (repeatMode === 0) {
    repeatBtn.classList.remove('active', 'repeat-one');
    repeatBtn.title = 'Repeat: off';
    repeatIcon.innerHTML = REPEAT_ALL_HTML;
  } else if (repeatMode === 1) {
    repeatBtn.classList.add('active');
    repeatBtn.classList.remove('repeat-one');
    repeatBtn.title = 'Repeat: all';
    repeatIcon.innerHTML = REPEAT_ALL_HTML;
  } else {
    repeatBtn.classList.add('active', 'repeat-one');
    repeatBtn.title = 'Repeat: one';
    repeatIcon.innerHTML = REPEAT_ONE_HTML;
  }
}

// ── Shuffle ──────────────────────────────────────────────────────────────────
let shuffleMode = false;
const shuffleBtn = document.getElementById('shuffle-btn');
shuffleBtn.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  shuffleBtn.classList.toggle('active', shuffleMode);
  shuffleBtn.title = shuffleMode ? 'Shuffle: on' : 'Shuffle: off';
});

repeatBtn.addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  updateRepeatBtn();
});

audio.addEventListener('ended', () => {
  if (repeatMode === 2) {
    audio.currentTime = 0;
    doPlay();
  } else if (shuffleMode && tracks.length > 1) {
    let next;
    do { next = Math.floor(Math.random() * tracks.length); } while (next === currentIndex);
    playTrack(next);
  } else if (currentIndex < tracks.length - 1) {
    playTrack(currentIndex + 1);
  } else if (repeatMode === 1) {
    playTrack(0);
  } else {
    setPlayState('stopped');
  }
});

// ── Volume (start at 50%) ─────────────────────────────────────────────────────
audio.volume = 0.5;
volBar.value = 50;

function updateVolBar() {
  const pct = volBar.value;
  volBar.style.background = `linear-gradient(to right, var(--muted) ${pct}%, var(--track-bg) ${pct}%)`;
}
function updateVolIcon() {
  let path;
  if (audio.muted || audio.volume === 0) {
    path = VOL_OFF;
  } else if (audio.volume < 0.34) {
    path = VOL_LOW;
  } else if (audio.volume < 0.67) {
    path = VOL_MED;
  } else {
    path = VOL_ON;
  }
  volIcon.setAttribute('d', path);
}

volBar.addEventListener('input', () => {
  audio.volume = volBar.value / 100;
  audio.muted = volBar.value == 0;
  updateVolBar();
  updateVolIcon();
});

muteBtn.addEventListener('click', () => {
  audio.muted = !audio.muted;
  updateVolIcon();
});

updateVolBar();
updateVolIcon();

// ── Clear ─────────────────────────────────────────────────────────────────────
clearBtn.addEventListener('click', () => {
  audio.pause();
  audio.src = '';
  setPlayState('stopped');
  objectUrls.forEach(u => URL.revokeObjectURL(u));
  objectUrls = []; tracks = []; currentIndex = -1;
  document.body.style.backgroundImage = 'none';
  vinylHide();
  trackNameEl.textContent = 'No track loaded';
  trackNameEl.classList.add('empty');
  trackArtistEl.textContent = '';
  document.getElementById('track-album').textContent = '';
  document.getElementById('current-time').textContent = '0:00';
  document.getElementById('duration').textContent = '0:00';
  seekBar.value = 0;
  seekBar.style.background = 'linear-gradient(to right, var(--accent) 0%, var(--track-bg) 0%)';
  coverArt.classList.remove('visible');
  coverPlaceholder.classList.remove('hidden');
    renderQueue();
});

// ── Colour options ────────────────────────────────────────────────────────────
const colourBtn     = document.getElementById('colour-btn');
const optionsPanel  = document.getElementById('options-panel');
const spectrumCanvas= document.getElementById('colour-spectrum');
const hueSlider     = document.getElementById('hue-slider');
const hexInput      = document.getElementById('hex-input');
const colourPreview = document.getElementById('colour-preview');
const applyColourBtn= document.getElementById('apply-colour-btn');
const ctx2d         = spectrumCanvas.getContext('2d');

let currentHue = 45;
let pickedColour = { h: 45, s: 0.92, l: 0.55 };

function drawSpectrum(hue) {
  const w = spectrumCanvas.width, h = spectrumCanvas.height;
  // White → hsl(hue,100%,50%) gradient (left to right = saturation)
  const gradH = ctx2d.createLinearGradient(0, 0, w, 0);
  gradH.addColorStop(0, 'white');
  gradH.addColorStop(1, `hsl(${hue}, 100%, 50%)`);
  ctx2d.fillStyle = gradH;
  ctx2d.fillRect(0, 0, w, h);
  // Transparent → black (top to bottom = lightness)
  const gradV = ctx2d.createLinearGradient(0, 0, 0, h);
  gradV.addColorStop(0, 'rgba(0,0,0,0)');
  gradV.addColorStop(1, 'rgba(0,0,0,1)');
  ctx2d.fillStyle = gradV;
  ctx2d.fillRect(0, 0, w, h);
}

function hslToHex(h, s, l) {
  s = Math.max(0, Math.min(1, s));
  l = Math.max(0, Math.min(1, l));
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    const col = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * col).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255;
  let g = parseInt(hex.slice(3,5),16)/255;
  let b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max) {
      case r: h = ((g-b)/d + (g<b?6:0))/6; break;
      case g: h = ((b-r)/d + 2)/6; break;
      default:h = ((r-g)/d + 4)/6;
    }
    h *= 360;
  }
  return {h, s, l};
}

function spectrumXYtoColour(x, y) {
  // x: 0=white, 1=full hue; y: 0=bright, 1=black
  const s = x;
  const l = 0.5 * (1 - y) * (2 - s);  // HSL from HSV approximation
  // Actually compute properly from pixel
  const imgData = ctx2d.getImageData(Math.round(x * (spectrumCanvas.width-1)), Math.round(y * (spectrumCanvas.height-1)), 1, 1).data;
  return `rgb(${imgData[0]},${imgData[1]},${imgData[2]})`;
}

function rgbToHex(r, g, b) {
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

let cursorX = 0.9, cursorY = 0.2;

function updatePreviewFromCursor() {
  const imgData = ctx2d.getImageData(
    Math.round(cursorX * (spectrumCanvas.width - 1)),
    Math.round(cursorY * (spectrumCanvas.height - 1)),
    1, 1
  ).data;
  const hex = rgbToHex(imgData[0], imgData[1], imgData[2]);
  hexInput.value = hex.toUpperCase();
  colourPreview.style.background = hex;
}

function moveCursor(x, y) {
  cursorX = Math.max(0, Math.min(1, x));
  cursorY = Math.max(0, Math.min(1, y));
  const cursor = document.getElementById('spectrum-cursor');
  cursor.style.left = (cursorX * 100) + '%';
  cursor.style.top  = (cursorY * 100) + '%';
  updatePreviewFromCursor();
}

drawSpectrum(currentHue);
moveCursor(0.9, 0.2);

// Spectrum interactions
let draggingSpectrum = false;
spectrumCanvas.addEventListener('mousedown', e => {
  draggingSpectrum = true;
  const r = spectrumCanvas.getBoundingClientRect();
  moveCursor((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
});
document.addEventListener('mousemove', e => {
  if (!draggingSpectrum) return;
  const r = spectrumCanvas.getBoundingClientRect();
  moveCursor((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
});
document.addEventListener('mouseup', () => draggingSpectrum = false);

// Hue slider
hueSlider.addEventListener('input', () => {
  currentHue = hueSlider.value;
  drawSpectrum(currentHue);
  moveCursor(cursorX, cursorY);
});

// Hex input
hexInput.addEventListener('input', () => {
  const val = hexInput.value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(val)) {
    colourPreview.style.background = val;
    // move cursor to approximate position
    const {h, s, l} = hexToHsl(val);
    currentHue = Math.round(h);
    hueSlider.value = currentHue;
    drawSpectrum(currentHue);
    // approximate cursor position from s and l
    const v = l + s * Math.min(l, 1 - l);
    const sv = v === 0 ? 0 : 2 * (1 - l/v);
    cursorX = sv;
    cursorY = 1 - v;
    moveCursor(cursorX, cursorY);
  }
});

// Apply
function applyAccent(hex) {
  document.documentElement.style.setProperty('--accent', hex);
  // derive hover (+lightness) and dim
  const {h, s, l} = hexToHsl(hex);
  const hoverHex = hslToHex(h, s, Math.min(1, l + 0.08));
  const dimRgb = `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;
  document.documentElement.style.setProperty('--accent-hover', hoverHex);
  document.documentElement.style.setProperty('--accent-dim', `rgba(${dimRgb},0.08)`);
  // vinyl label colour is set by artwork dominant colour only
}

applyColourBtn.addEventListener('click', () => {
  const val = hexInput.value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(val)) {
    applyAccent(val);
    optionsPanel.classList.remove('open');
  }
});

// Allow Enter in hex input
hexInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') applyColourBtn.click();
});

// Toggle panel
colourBtn.addEventListener('click', e => {
  e.stopPropagation();
  optionsPanel.classList.toggle('open');
  if (optionsPanel.classList.contains('open')) {
    hexInput.value = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim().toUpperCase();
    colourPreview.style.background = hexInput.value;
  }
});

// Close on outside click
document.addEventListener('click', e => {
  if (!optionsPanel.contains(e.target) && e.target !== colourBtn) {
    optionsPanel.classList.remove('open');
  }
});

</script>
